name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Unit tests first: fast, deterministic, no build needed.
      - name: Test
        run: pnpm test

      # The build generates the Plasmo type stubs (.plasmo/, gitignored) that the
      # typecheck below depends on, and confirms the extension bundles.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm exec tsc --noEmit
