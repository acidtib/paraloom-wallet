name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The vitest suite is the deterministic, self-contained check: it needs no
      # build and no proving keys. A full `plasmo build` / `tsc --noEmit` can't run
      # here because the prover keys and wasm (lib/prover/*.key, *.wasm) are
      # multi-megabyte build artifacts kept out of git, and the build resolves them
      # as URL imports. So CI verifies the logic that ships in tests.
      - name: Test
        run: pnpm test
